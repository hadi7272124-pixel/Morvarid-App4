name: Build Mervarid APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild project
        shell: bash
        run: |
          set -e
          tr -d '\r\n ' < MERVARID_PROJECT_PAYLOAD.txt | base64 -d > project.zip
          rm -rf unpacked
          mkdir unpacked
          unzip -q project.zip -d unpacked
          ROOT="$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          cp -a "$ROOT"/. .
          rm -rf unpacked project.zip
          test -f settings.gradle
          test -f app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MervaridProcessViewer-v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MervaridProcessViewer-v2-installable-apk
          path: MervaridProcessViewer-v2.apk
